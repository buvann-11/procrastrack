name: Sync package-lock.json

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/sync-lockfile.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --package-lock-only --no-audit --no-fund
      - run: npm ci && npm run lint && npm run build
      - name: Commit updated lockfile
        run: |
          if git diff --quiet package-lock.json; then
            echo "Lockfile already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Sync package-lock.json with package.json"
            git push
          fi
